<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro – InvoSys</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">

  <div class="card shadow p-4 rounded-4" style="max-width:400px;width:100%">
    <h3 class="text-center mb-4">Registro de Usuario</h3>
    <form id="registerForm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="text" id="telefono" class="form-control">
      </div>
      <div class="mb-3">
        <label for="passwordReg" class="form-label">Contraseña</label>
        <input type="password" id="passwordReg" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100">Registrar</button>
    </form>
    <div id="respReg" class="mt-3 text-center"></div>
    <p class="text-center mt-3 mb-0">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const data = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        password: document.getElementById('passwordReg').value
      };
      const res = await fetch('http://localhost:5000/api/register',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
      });
      const json = await res.json();
      const msg = document.getElementById('respReg');
      msg.innerText = json.message;
      msg.className = res.ok?'text-success':'text-danger';
      if(res.ok) setTimeout(()=>location.href='login.html',800);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
