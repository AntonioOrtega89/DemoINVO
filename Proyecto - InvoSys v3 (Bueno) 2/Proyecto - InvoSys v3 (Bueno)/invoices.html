<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Facturas – InvoSys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <script>
    if (!localStorage.getItem('currentUserId')) {
      window.location.href = 'login.html';
    }
  </script>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand" href="generacion_factura.html">
        <i class="bi bi-inboxes-fill me-1"></i>InvoSys
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu2">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu2">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="generacion_factura.html">
              <i class="bi bi-file-earmark-plus me-1"></i>Nueva Factura
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="invoices.html">
              <i class="bi bi-receipt me-1"></i>Mis Facturas
            </a>
          </li>
        </ul>
        <button id="logoutBtn2" class="btn btn-outline-danger">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center mb-4">
      <i class="bi bi-receipt-cutoff me-2"></i>Mis Facturas
    </h2>

    <div id="noInv" class="alert alert-info text-center d-none">
      <i class="bi bi-info-circle-fill me-1"></i>No tienes facturas generadas todavía.
    </div>

    <table id="tblInv" class="table table-striped table-hover d-none">
      <thead class="table-dark">
        <tr>
          <th>Factura Nº</th>
          <th>Fecha</th>
          <th class="text-end">Total (MXN)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const logout2 = document.getElementById('logoutBtn2');
    const tblInv  = document.getElementById('tblInv');
    const noInv   = document.getElementById('noInv');
    const tbody   = tblInv.querySelector('tbody');

    logout2.onclick = () => {
      localStorage.removeItem('currentUserId');
      window.location.href = 'login.html';
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const uid = localStorage.getItem('currentUserId');
      try {
        const res  = await fetch(`http://localhost:5000/api/invoices?user_id=${uid}`);
        const json = await res.json();
        if (!res.ok) throw new Error(json.message);

        if (json.invoices.length === 0) {
          noInv.classList.remove('d-none');
          return;
        }

        json.invoices.forEach(f => {
          tbody.insertAdjacentHTML('beforeend', `
            <tr>
              <td>${f.invoice_number}</td>
              <td>${f.invoice_date}</td>
              <td class="text-end">MXN $ ${f.total_amount.toFixed(2)}</td>
            </tr>
          `);
        });
        tblInv.classList.remove('d-none');

      } catch(err) {
        console.error('Error fetching invoices:', err);
        noInv.textContent = 'Error al cargar facturas.';
        noInv.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
