<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login – InvoSys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
</head>
<body class="bg-light d-flex align-items-center justify-content-center" 
      style="min-height:100vh;">

  <div class="card shadow p-4 rounded-4" style="max-width:400px; width:100%;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Siguiente</button>
    </form>
    <div id="msg" class="mt-3 text-center"></div>
    <p class="text-center mt-3 mb-0">
      <a href="registro.html">¿No tienes cuenta? Regístrate</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg  = document.getElementById('msg');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = '';

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:5000/api/login', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ email, password })
        });
        const json = await res.json();
        console.log('LOGIN response:', res.status, json);

        if (!res.ok) {
          msg.innerText = json.message || 'Error al iniciar sesión';
          msg.className = 'text-danger';
          return;
        }

        // guarda y redirige
        localStorage.setItem('currentUserId', json.id_usuario);
        window.location.href = 'generacion_factura.html';

      } catch (err) {
        msg.innerText = 'No se pudo conectar al servidor';
        msg.className = 'text-danger';
        console.error(err);
      }
    });
  </script>

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
